# Dependabot version updates (F3 fleet unit): npm at the root manifest plus
# github-actions, weekly. Non-major updates are grouped into one PR per
# ecosystem (minor-and-patch); majors still open individually for review.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
