name: Automerge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Check auto-merge state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          enabled="$(gh pr view '${{ github.event.pull_request.number }}'
          --repo '${{ github.repository }}' --json autoMergeRequest
          --jq '.autoMergeRequest != null')";
          echo "already_enabled=${enabled}" >> "${GITHUB_OUTPUT}"

      - name: Enable auto-merge (squash)
        if: steps.state.outputs.already_enabled == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh pr merge --auto --squash
          --repo '${{ github.repository }}'
          '${{ github.event.pull_request.number }}'
