name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR title (conventional commits, breaking ! supported)
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -m ci.validate_pr_title --title "$PR_TITLE"

  # No linter is configured. This job is not a stub: node --check parses
  # every shipped source file (entrypoint, src/ ports, gate scripts) and
  # fails the job on any syntax error. Documented scope; widens if a real
  # linter lands.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check (node --check over shipped sources, same as npm run lint)
        shell: bash
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm pack runs the prepare hook, and the prepare hook installs the
      # repo git hooks via scripts/security/install-hooks.sh, which requires
      # gitleaks on PATH (hosted runners do not ship it; same pinned recipe
      # as security.yml). Without this the job fails on every PR (proven by
      # the F3 fleet unit on the first dependabot pull request).
      - name: Install pinned gitleaks v8.30.1 (the prepare hook requires it)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'linux_x64.tar.gz' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Build artifact check (package must pack cleanly)
        shell: bash
        run: npm pack --dry-run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit and behavioral tests (node --test)
        shell: bash
        run: npm test

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: License and NOTICE compliance
        shell: bash
        run: node scripts/check-license.mjs

  tarball-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same prepare-hook dependency as the build job: check-tarball.mjs
      # packs the package internally, npm pack runs prepare, prepare needs
      # gitleaks on PATH.
      - name: Install pinned gitleaks v8.30.1 (the prepare hook requires it)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'linux_x64.tar.gz' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Tarball allowlist and leak gates
        shell: bash
        run: node scripts/check-tarball.mjs

  version-immutability:
    # Release-bot PRs are exempt: the release pipeline owns the version field.
    # The identity comes from the RELEASE_BOT_LOGIN repo variable and the gate
    # is fail-closed: when the variable is unset, the exemption matches
    # nobody and the check runs on every PR.
    if: github.event.pull_request.user.login != vars.RELEASE_BOT_LOGIN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version immutability (package.json version is release-automation-owned)
        shell: bash
        run: python3 -m ci.check_version_immutability --base-ref origin/main
