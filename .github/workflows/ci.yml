name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR title (conventional commits, breaking ! supported)
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -m ci.validate_pr_title --title "$PR_TITLE"

  # No linter is configured. This job is not a stub: node --check parses
  # every shipped source file (entrypoint, src/ ports, gate scripts) and
  # fails the job on any syntax error. Documented scope; widens if a real
  # linter lands.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check (node --check over shipped sources)
        shell: bash
        run: |
          node --check index.js
          node --check src/zai-quota.js
          node --check src/request-body.js
          node --check src/model-profiles.js
          node --check scripts/check-license.mjs
          node --check scripts/check-tarball.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build artifact check (package must pack cleanly)
        shell: bash
        run: npm pack --dry-run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit and behavioral tests (node --test)
        shell: bash
        run: npm test

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: License and NOTICE compliance
        shell: bash
        run: node scripts/check-license.mjs

  tarball-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tarball allowlist and leak gates
        shell: bash
        run: node scripts/check-tarball.mjs

  version-immutability:
    # Release-bot PRs are exempt: the release pipeline owns the version field.
    # The identity comes from the RELEASE_BOT_LOGIN repo variable and the gate
    # is fail-closed: when the variable is unset, the exemption matches
    # nobody and the check runs on every PR.
    if: github.event.pull_request.user.login != vars.RELEASE_BOT_LOGIN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version immutability (package.json version is release-automation-owned)
        shell: bash
        run: python3 -m ci.check_version_immutability --base-ref origin/main
